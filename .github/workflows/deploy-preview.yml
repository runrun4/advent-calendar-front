# develop 宛て PR ごとにプレビューURLへデプロイし、URLをPRコメントで知らせる。
# マージ前の実装をチーム全員がスマホ/ブラウザで確認できる。
name: preview

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: プレビューへデプロイ
        id: deploy
        run: |
          npx wrangler@4 pages deploy ./dist --project-name advent-calendar-front --branch "${{ github.head_ref }}" | tee deploy.log
          echo "url=$(grep -Eo 'https://[^ ]+\.pages\.dev' deploy.log | tail -1)" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 904ca712168ab8ac1f60b53bf1690eaa
      - name: プレビューURLをPRへコメント
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "🔍 プレビュー: ${{ steps.deploy.outputs.url }} （commit ${GITHUB_SHA::7}）" \
            --edit-last --create-if-none
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
